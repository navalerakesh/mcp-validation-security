name: MCP Validator
description: Validate MCP servers in GitHub Actions with policy gates, workflow summaries, annotations, and artifacts.
author: Rakesh Navale

branding:
  icon: shield
  color: blue

inputs:
  server:
    description: MCP server endpoint or STDIO command.
    required: false
  config-file:
    description: Optional path to a validation config file.
    required: false
  access:
    description: Access profile passed to mcpval.
    required: false
    default: public
  token:
    description: Optional bearer token for authenticated servers. Passed through a masked environment variable, not command arguments.
    required: false
  interactive:
    description: Whether to allow interactive authentication.
    required: false
    default: "false"
  output-dir:
    description: Directory where validation artifacts will be written.
    required: false
    default: ./mcp-validation-results
  mcpspec:
    description: Optional MCP spec profile.
    required: false
  policy:
    description: Validation policy mode.
    required: false
    default: balanced
  max-concurrency:
    description: Optional max in-flight request count.
    required: false
  version:
    description: Optional exact McpVal NuGet version. Defaults to the version declared by this Action revision.
    required: false
  package-source:
    description: Optional NuGet source containing the exact McpVal package. Intended for pre-publish verification.
    required: false
  github-summary:
    description: Emit GitHub step summary markdown.
    required: false
    default: "true"
  github-annotations:
    description: Emit GitHub workflow error, warning, and notice annotations.
    required: false
    default: "true"
  upload-artifacts:
    description: Upload the output directory as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Artifact name used when uploading results.
    required: false
    default: mcpval-results
  baseline:
    description: Optional approved canonical result used for regression comparison.
    required: false
  regression-only:
    description: Block only regressions relative to the explicit baseline.
    required: false
    default: "false"
  dry-run:
    description: Plan validation without contacting the target.
    required: false
    default: "false"
  output-format:
    description: Optional command output format. Supported value is json.
    required: false

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.419

    - name: Resolve McpVal version
      id: mcpval-version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="$INPUT_VERSION"
        if [[ -z "$version" ]]; then
          version=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' "$GITHUB_ACTION_PATH/Directory.Build.props")
        fi

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Unable to resolve an exact McpVal version from this Action revision." >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install McpVal
      shell: bash
      env:
        INPUT_PACKAGE_SOURCE: ${{ inputs.package-source }}
      run: |
        set -euo pipefail
        tool_path="$RUNNER_TEMP/mcpval-tool"
        mkdir -p "$tool_path"

        install_args=(--tool-path "$tool_path" McpVal --version "${{ steps.mcpval-version.outputs.version }}")
        if [[ -n "$INPUT_PACKAGE_SOURCE" ]]; then
          config_dir="$RUNNER_TEMP/mcpval-nuget-config"
          config_file="$config_dir/NuGet.Config"
          mkdir -p "$config_dir"
          cat > "$config_file" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local-smoke" value="$INPUT_PACKAGE_SOURCE" />
          </packageSources>
        </configuration>
        EOF
          install_args+=(--configfile "$config_file")
        fi
        dotnet tool install "${install_args[@]}"

        echo "$tool_path" >> "$GITHUB_PATH"

    - name: Run MCP validation
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ACCESS: ${{ inputs.access }}
        MCPVAL_TOKEN: ${{ inputs.token }}
        INPUT_INTERACTIVE: ${{ inputs.interactive }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_MCPSPEC: ${{ inputs.mcpspec }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_MAX_CONCURRENCY: ${{ inputs.max-concurrency }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_REGRESSION_ONLY: ${{ inputs.regression-only }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        MCPVAL_GITHUB_SUMMARY: ${{ inputs.github-summary }}
        MCPVAL_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
      run: |
        set -euo pipefail

        if [[ -n "$MCPVAL_TOKEN" ]]; then
          echo "::add-mask::$MCPVAL_TOKEN"
        fi

        if [[ -z "$INPUT_SERVER" && -z "$INPUT_CONFIG_FILE" ]]; then
          echo "Either 'server' or 'config-file' must be provided." >&2
          exit 1
        fi

        mkdir -p "$INPUT_OUTPUT_DIR"

        cmd=(mcpval validate --output "$INPUT_OUTPUT_DIR" --policy "$INPUT_POLICY")

        if [[ -n "$INPUT_SERVER" ]]; then
          cmd+=(--server "$INPUT_SERVER")
        fi

        if [[ -n "$INPUT_CONFIG_FILE" ]]; then
          cmd+=(--config "$INPUT_CONFIG_FILE")
        fi

        if [[ -n "$INPUT_ACCESS" ]]; then
          cmd+=(--access "$INPUT_ACCESS")
        fi

        if [[ "$INPUT_INTERACTIVE" == "true" ]]; then
          cmd+=(--interactive)
        fi

        if [[ -n "$INPUT_MCPSPEC" ]]; then
          cmd+=(--mcpspec "$INPUT_MCPSPEC")
        fi

        if [[ -n "$INPUT_MAX_CONCURRENCY" ]]; then
          cmd+=(--max-concurrency "$INPUT_MAX_CONCURRENCY")
        fi

        if [[ -n "$INPUT_BASELINE" ]]; then
          cmd+=(--baseline "$INPUT_BASELINE")
        fi

        if [[ "$INPUT_REGRESSION_ONLY" == "true" ]]; then
          if [[ -z "$INPUT_BASELINE" ]]; then
            echo "'regression-only' requires 'baseline'." >&2
            exit 1
          fi
          cmd+=(--regression-only)
        elif [[ "$INPUT_REGRESSION_ONLY" != "false" ]]; then
          echo "'regression-only' must be 'true' or 'false'." >&2
          exit 1
        fi

        if [[ "$INPUT_DRY_RUN" == "true" ]]; then
          cmd+=(--dry-run)
        elif [[ "$INPUT_DRY_RUN" != "false" ]]; then
          echo "'dry-run' must be 'true' or 'false'." >&2
          exit 1
        fi

        if [[ -n "$INPUT_OUTPUT_FORMAT" ]]; then
          if [[ "$INPUT_OUTPUT_FORMAT" != "json" ]]; then
            echo "'output-format' supports only 'json'." >&2
            exit 1
          fi
          cmd+=(--output-format "$INPUT_OUTPUT_FORMAT")
        fi

        echo "Running mcpval validation with redacted input values."

        "${cmd[@]}"

    - name: Upload validation artifacts
      if: ${{ always() && inputs.upload-artifacts == 'true' && inputs.output-dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}