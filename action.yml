name: MCP Validator
description: Validate MCP servers in GitHub Actions with policy gates, workflow summaries, annotations, and artifacts.
author: Rakesh Navale

branding:
  icon: shield
  color: blue

inputs:
  server:
    description: MCP server endpoint or STDIO command.
    required: false
  config-file:
    description: Optional path to a validation config file.
    required: false
  access:
    description: Access profile passed to mcpval.
    required: false
    default: public
  token:
    description: Optional bearer token for authenticated servers. Passed through a masked environment variable, not command arguments.
    required: false
  interactive:
    description: Compatibility input. Must be false; CI never admits interactive authentication.
    required: false
    default: "false"
  output-dir:
    description: Directory where validation artifacts will be written.
    required: false
    default: ./mcp-validation-results
  mcpspec:
    description: Optional MCP spec profile.
    required: false
  policy:
    description: Validation policy mode.
    required: false
    default: balanced
  assurance:
    description: Assurance profile (inventory, ci, comprehensive, provider). Active comprehensive requires admitted mode, conformance-results, identity-baseline and validation-id.
    required: false
    default: inventory
  max-concurrency:
    description: Optional max in-flight request count.
    required: false
  max-requests:
    description: Optional actual outbound-attempt limit, validated by the CLI.
    required: false
  timeout:
    description: Optional per-request timeout in seconds. Total-run deadline remains configuration-owned.
    required: false
  protocol-era:
    description: Optional auto, legacy or modern selection.
    required: false
  client-profiles:
    description: Optional comma-separated client profile IDs for interpretation.
    required: false
  allowed-hosts:
    description: Optional comma-separated approved outbound hosts.
    required: false
  allowed-origins:
    description: Optional comma-separated approved HTTP origins.
    required: false
  allow-private-addresses:
    description: Explicitly permit private/loopback targets in the approved environment.
    required: false
    default: "false"
  persistence-mode:
    description: Optional ephemeral, explicit-output or session persistence.
    required: false
  redact-level:
    description: Optional strict or standard redaction.
    required: false
  trace:
    description: Optional off, redacted or full trace setting, subject to CLI admission.
    required: false
  version:
    description: Optional exact McpVal NuGet version. Defaults to the version declared by this Action revision.
    required: false
  package-source:
    description: Optional NuGet source containing the exact McpVal package. Intended for pre-publish verification.
    required: false
  github-summary:
    description: Emit GitHub step summary markdown.
    required: false
    default: "true"
  github-annotations:
    description: Emit GitHub workflow error, warning, and notice annotations.
    required: false
    default: "true"
  upload-artifacts:
    description: Upload the output directory as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Artifact name used when uploading results.
    required: false
    default: mcpval-results
  baseline:
    description: Optional approved canonical result used for regression comparison.
    required: false
  conformance-results:
    description: Optional pinned official conformance evidence wrapper JSON.
    required: false
  identity-baseline:
    description: Operator-approved signed identity baseline selection for comprehensive assurance.
    required: false
  validation-id:
    description: Independently reserved run ID bound to the identity baseline. Required for active comprehensive assurance.
    required: false
  provider-harness:
    description: Signed provider harness manifest JSON. Required for active provider assurance.
    required: false
  provider-authorization-key:
    description: Operator-trusted provider authorization public key PEM. Required for active provider assurance.
    required: false
  attestation-private-key:
    description: P-256 private key PEM used to sign the final assurance result. Store as a protected secret.
    required: false
  extensions:
    description: Optional comma-separated MCP extension IDs to assess.
    required: false
  mode:
    description: Execution mode passed to mcpval (safe, standard, elevated).
    required: false
    default: safe
  confirm-elevated-risk:
    description: Required acknowledgement when mode is elevated.
    required: false
    default: "false"
  regression-only:
    description: Block only regressions relative to the explicit baseline.
    required: false
    default: "false"
  dry-run:
    description: Plan validation without contacting the target.
    required: false
    default: "false"
  output-format:
    description: Optional command output format. Supported value is json.
    required: false

outputs:
  exit-code:
    description: Actual mcpval collector exit code when invoked and published. Does not imply assurance success or artifact completeness; publication failure makes the step exit 70.
    value: ${{ steps.mcpval-validation.outputs.exit-code }}
  artifact-state:
    description: Published, partial, plan-only, missing, or corrupt artifact receipt; not an assurance verdict.
    value: ${{ steps.mcpval-validation.outputs.artifact-state }}
  artifact-directory:
    description: Isolated current-invocation artifact directory.
    value: ${{ steps.mcpval-validation.outputs.artifact-directory }}
  invocation-directory:
    description: Current isolated collection directory, retained even if artifact verification fails.
    value: ${{ steps.mcpval-validation.outputs.invocation-directory }}
  result-path:
    description: Digest-checked canonical result path, empty when unavailable.
    value: ${{ steps.mcpval-validation.outputs.result-path }}
  audit-path:
    description: Matching audit manifest path, empty when unavailable.
    value: ${{ steps.mcpval-validation.outputs.audit-path }}
  artifact-paths:
    description: JSON array of digest-checked subjects and their audit manifest.
    value: ${{ steps.mcpval-validation.outputs.artifact-paths }}
  validation-id:
    description: Recorded current run identity, empty when unavailable.
    value: ${{ steps.mcpval-validation.outputs.validation-id }}
  run-termination:
    description: Recorded execution termination, not an assurance verdict.
    value: ${{ steps.mcpval-validation.outputs.run-termination }}
  target-identity-sha256:
    description: Matching recorded target digest from the result and audit; not independent target authentication.
    value: ${{ steps.mcpval-validation.outputs.target-identity-sha256 }}
  policy-passed:
    description: Canonical recorded policy decision; never recomputed by the Action.
    value: ${{ steps.mcpval-validation.outputs.policy-passed }}
  assurance-profile:
    description: Recorded assurance profile.
    value: ${{ steps.mcpval-validation.outputs.assurance-profile }}
  core-conformance:
    description: Recorded core conformance assessment.
    value: ${{ steps.mcpval-validation.outputs.core-conformance }}
  security-assurance:
    description: Recorded security assurance assessment.
    value: ${{ steps.mcpval-validation.outputs.security-assurance }}
  operational-readiness:
    description: Recorded operational readiness assessment.
    value: ${{ steps.mcpval-validation.outputs.operational-readiness }}

runs:
  using: composite
  steps:
    - name: Setup artifact receipt runtime
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.19.0

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 8.0.419

    - name: Resolve McpVal version
      id: mcpval-version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        version="$INPUT_VERSION"
        if [[ -z "$version" ]]; then
          version=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' "$GITHUB_ACTION_PATH/Directory.Build.props")
        fi

        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "Unable to resolve an exact McpVal version from this Action revision." >&2
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Install McpVal
      shell: bash
      env:
        INPUT_PACKAGE_SOURCE: ${{ inputs.package-source }}
      run: |
        set -euo pipefail
        tool_path="$RUNNER_TEMP/mcpval-tool"
        mkdir -p "$tool_path"

        install_args=(--tool-path "$tool_path" McpVal --version "${{ steps.mcpval-version.outputs.version }}")
        if [[ -n "$INPUT_PACKAGE_SOURCE" ]]; then
          config_dir="$RUNNER_TEMP/mcpval-nuget-config"
          config_file="$config_dir/NuGet.Config"
          mkdir -p "$config_dir"
          cat > "$config_file" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local-smoke" value="$INPUT_PACKAGE_SOURCE" />
          </packageSources>
        </configuration>
        EOF
          install_args+=(--configfile "$config_file")
        fi
        dotnet tool install "${install_args[@]}"

        echo "$tool_path" >> "$GITHUB_PATH"

    - name: Run MCP validation
      id: mcpval-validation
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_ACCESS: ${{ inputs.access }}
        MCPVAL_TOKEN: ${{ inputs.token }}
        INPUT_INTERACTIVE: ${{ inputs.interactive }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_MCPSPEC: ${{ inputs.mcpspec }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_ASSURANCE: ${{ inputs.assurance }}
        INPUT_MAX_CONCURRENCY: ${{ inputs.max-concurrency }}
        INPUT_MAX_REQUESTS: ${{ inputs.max-requests }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_PROTOCOL_ERA: ${{ inputs.protocol-era }}
        INPUT_CLIENT_PROFILES: ${{ inputs.client-profiles }}
        INPUT_ALLOWED_HOSTS: ${{ inputs.allowed-hosts }}
        INPUT_ALLOWED_ORIGINS: ${{ inputs.allowed-origins }}
        INPUT_ALLOW_PRIVATE_ADDRESSES: ${{ inputs.allow-private-addresses }}
        INPUT_PERSISTENCE_MODE: ${{ inputs.persistence-mode }}
        INPUT_REDACT_LEVEL: ${{ inputs.redact-level }}
        INPUT_TRACE: ${{ inputs.trace }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CONFORMANCE_RESULTS: ${{ inputs.conformance-results }}
        INPUT_IDENTITY_BASELINE: ${{ inputs.identity-baseline }}
        INPUT_VALIDATION_ID: ${{ inputs.validation-id }}
        INPUT_PROVIDER_HARNESS: ${{ inputs.provider-harness }}
        INPUT_PROVIDER_AUTHORIZATION_KEY: ${{ inputs.provider-authorization-key }}
        MCPVAL_ATTESTATION_PRIVATE_KEY_PEM: ${{ inputs.attestation-private-key }}
        INPUT_EXTENSIONS: ${{ inputs.extensions }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIRM_ELEVATED_RISK: ${{ inputs.confirm-elevated-risk }}
        INPUT_REGRESSION_ONLY: ${{ inputs.regression-only }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        MCPVAL_GITHUB_SUMMARY: ${{ inputs.github-summary }}
        MCPVAL_GITHUB_ANNOTATIONS: ${{ inputs.github-annotations }}
      run: |
        set -euo pipefail

        if [[ -n "$MCPVAL_TOKEN" ]]; then
          echo "::add-mask::$MCPVAL_TOKEN"
        fi
        if [[ -n "$MCPVAL_ATTESTATION_PRIVATE_KEY_PEM" ]]; then
          echo "::add-mask::$MCPVAL_ATTESTATION_PRIVATE_KEY_PEM"
        fi

        if [[ -z "$INPUT_SERVER" && -z "$INPUT_CONFIG_FILE" ]]; then
          echo "Either 'server' or 'config-file' must be provided." >&2
          exit 1
        fi

        if [[ "$INPUT_INTERACTIVE" != "false" ]]; then
          echo "'interactive' must be 'false'; CI requires an approved noninteractive credential source." >&2
          exit 1
        fi
        if [[ -z "$INPUT_OUTPUT_DIR" || "$INPUT_OUTPUT_DIR" == *$'\n'* || "$INPUT_OUTPUT_DIR" == *$'\r'* ]]; then
          echo "'output-dir' must be a non-empty path without line breaks." >&2
          exit 1
        fi

        cmd=(mcpval validate --policy "$INPUT_POLICY")

        if [[ "$INPUT_ASSURANCE" != "inventory" && "$INPUT_ASSURANCE" != "ci" && "$INPUT_ASSURANCE" != "comprehensive" && "$INPUT_ASSURANCE" != "provider" ]]; then
          echo "'assurance' must be 'inventory', 'ci', 'comprehensive', or 'provider'." >&2
          exit 1
        fi
        cmd+=(--assurance "$INPUT_ASSURANCE")

        if [[ -n "$INPUT_SERVER" ]]; then
          cmd+=(--server "$INPUT_SERVER")
        fi

        if [[ -n "$INPUT_CONFIG_FILE" ]]; then
          cmd+=(--config "$INPUT_CONFIG_FILE")
        fi

        if [[ -n "$INPUT_ACCESS" ]]; then
          cmd+=(--access "$INPUT_ACCESS")
        fi

        if [[ -n "$INPUT_MCPSPEC" ]]; then
          cmd+=(--mcpspec "$INPUT_MCPSPEC")
        fi

        if [[ -n "$INPUT_MAX_CONCURRENCY" ]]; then
          cmd+=(--max-concurrency "$INPUT_MAX_CONCURRENCY")
        fi
        append_value() {
          local value="$1"
          local option="$2"
          if [[ -z "$value" ]]; then return; fi
          if [[ "$value" == -* || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "Invalid typed Action option value; collector was not launched." >&2
            exit 1
          fi
          cmd+=("$option" "$value")
        }
        append_list() {
          local input="$1"
          local option="$2"
          local pattern="${3:-}"
          local values=()
          local value
          if [[ -z "$input" ]]; then return; fi
          if [[ "$input" == *, || "$input" == *$'\n'* || "$input" == *$'\r'* ]]; then
            echo "Typed list inputs must not contain empty entries." >&2
            exit 1
          fi
          IFS=',' read -r -a values <<< "$input"
          for value in "${values[@]}"; do
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ -z "$value" ]]; then
              echo "Typed list inputs must not contain empty entries." >&2
              exit 1
            fi
            if [[ -n "$pattern" && ! "$value" =~ $pattern ]]; then
              echo "Typed list input contains an invalid identifier." >&2
              exit 1
            fi
            append_value "$value" "$option"
          done
        }
        append_value "$INPUT_MAX_REQUESTS" --max-requests
        append_value "$INPUT_TIMEOUT" --timeout
        append_value "$INPUT_PROTOCOL_ERA" --protocol-era
        append_value "$INPUT_PERSISTENCE_MODE" --persistence-mode
        append_value "$INPUT_REDACT_LEVEL" --redact-level
        append_value "$INPUT_TRACE" --trace
        append_list "$INPUT_CLIENT_PROFILES" --client-profile
        append_list "$INPUT_ALLOWED_HOSTS" --allow-host
        append_list "$INPUT_ALLOWED_ORIGINS" --allow-origin
        if [[ "$INPUT_ALLOW_PRIVATE_ADDRESSES" == "true" ]]; then
          cmd+=(--allow-private-addresses)
        elif [[ "$INPUT_ALLOW_PRIVATE_ADDRESSES" != "false" ]]; then
          echo "'allow-private-addresses' must be 'true' or 'false'." >&2
          exit 1
        fi

        if [[ -n "$INPUT_BASELINE" ]]; then
          cmd+=(--baseline "$INPUT_BASELINE")
        fi

        if [[ -n "$INPUT_CONFORMANCE_RESULTS" ]]; then
          cmd+=(--conformance-results "$INPUT_CONFORMANCE_RESULTS")
        fi

        if [[ "$INPUT_ASSURANCE" == "comprehensive" && "$INPUT_DRY_RUN" != "true" ]]; then
          if [[ "$INPUT_MODE" == "safe" || -z "$INPUT_IDENTITY_BASELINE" || -z "$INPUT_VALIDATION_ID" || -z "$INPUT_CONFORMANCE_RESULTS" ]]; then
            echo "Active comprehensive assurance requires standard/elevated admission, identity-baseline, validation-id, and conformance-results." >&2
            exit 1
          fi
        fi
        if [[ -n "$INPUT_IDENTITY_BASELINE" ]]; then
          cmd+=(--identity-baseline "$INPUT_IDENTITY_BASELINE")
        fi
        if [[ -n "$INPUT_VALIDATION_ID" ]]; then
          cmd+=(--validation-id "$INPUT_VALIDATION_ID")
        fi

        if [[ "$INPUT_ASSURANCE" == "provider" && "$INPUT_DRY_RUN" != "true" ]]; then
          if [[ -z "$INPUT_PROVIDER_HARNESS" || -z "$INPUT_PROVIDER_AUTHORIZATION_KEY" || -z "$INPUT_CONFORMANCE_RESULTS" || -z "$MCPVAL_ATTESTATION_PRIVATE_KEY_PEM" ]]; then
            echo "Active provider assurance requires provider-harness, provider-authorization-key, conformance-results, and attestation-private-key." >&2
            exit 1
          fi
          cmd+=(--provider-harness "$INPUT_PROVIDER_HARNESS")
          cmd+=(--provider-authorization-key "$INPUT_PROVIDER_AUTHORIZATION_KEY")
          cmd+=(--sign-attestation)
        fi

        if [[ "$INPUT_MODE" != "safe" && "$INPUT_MODE" != "standard" && "$INPUT_MODE" != "elevated" ]]; then
          echo "'mode' must be 'safe', 'standard', or 'elevated'." >&2
          exit 1
        fi
        cmd+=(--mode "$INPUT_MODE")

        if [[ "$INPUT_CONFIRM_ELEVATED_RISK" == "true" ]]; then
          cmd+=(--confirm-elevated-risk)
        elif [[ "$INPUT_CONFIRM_ELEVATED_RISK" != "false" ]]; then
          echo "'confirm-elevated-risk' must be 'true' or 'false'." >&2
          exit 1
        elif [[ "$INPUT_MODE" == "elevated" ]]; then
          echo "'mode: elevated' requires 'confirm-elevated-risk: true'." >&2
          exit 1
        fi

        append_list "$INPUT_EXTENSIONS" --extension '^[A-Za-z0-9][A-Za-z0-9._/-]*$'

        if [[ "$INPUT_REGRESSION_ONLY" == "true" ]]; then
          if [[ -z "$INPUT_BASELINE" ]]; then
            echo "'regression-only' requires 'baseline'." >&2
            exit 1
          fi
          cmd+=(--regression-only)
        elif [[ "$INPUT_REGRESSION_ONLY" != "false" ]]; then
          echo "'regression-only' must be 'true' or 'false'." >&2
          exit 1
        fi

        if [[ "$INPUT_DRY_RUN" == "true" ]]; then
          cmd+=(--dry-run)
        elif [[ "$INPUT_DRY_RUN" != "false" ]]; then
          echo "'dry-run' must be 'true' or 'false'." >&2
          exit 1
        fi

        if [[ -n "$INPUT_OUTPUT_FORMAT" ]]; then
          if [[ "$INPUT_OUTPUT_FORMAT" != "json" ]]; then
            echo "'output-format' supports only 'json'." >&2
            exit 1
          fi
          cmd+=(--output-format "$INPUT_OUTPUT_FORMAT")
        fi

        typed_artifacts() {
          env -u MCPVAL_TOKEN -u MCPVAL_ATTESTATION_PRIVATE_KEY_PEM node "$GITHUB_ACTION_PATH/scripts/publish-action-artifacts.mjs" "$@"
        }
        # A previous bundle must never satisfy this invocation's output contract.
        invocation_output="$(typed_artifacts prepare "$INPUT_OUTPUT_DIR")"
        cmd+=(--output "$invocation_output")
        echo "Running mcpval validation with redacted input values."

        if "${cmd[@]}"; then
          collector_exit=0
        else
          collector_exit=$?
        fi
        if [[ -z "${GITHUB_OUTPUT:-}" ]] || ! { printf 'exit-code=%s\ninvocation-directory=%s\n' "$collector_exit" "$invocation_output" >> "$GITHUB_OUTPUT"; } 2>/dev/null; then
          echo "::error::Unable to publish collector exit status (collector exit: $collector_exit)."
          exit 70
        fi
        if ! typed_artifacts publish "$invocation_output" "$collector_exit" "$INPUT_DRY_RUN"; then
          exit 70
        fi
        exit "$collector_exit"

    - name: Upload validation artifacts
      if: ${{ always() && inputs.upload-artifacts == 'true' && steps.mcpval-validation.outputs.invocation-directory != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.mcpval-validation.outputs.invocation-directory }}
        if-no-files-found: error