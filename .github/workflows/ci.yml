name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

concurrency:
  group: mcpval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24.19.0'
  PROJECT_PATH: 'Mcp.Benchmark.CLI/Mcp.Benchmark.CLI.csproj'
  # Exact version comes from Directory.Build.props and is shared by every channel.

permissions:
  contents: read

jobs:
  # Build, Test, and Scan
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Resolve exact version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Directory.Build.props must declare an exact semantic version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mcpval-mcp/package-lock.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Install npm dependencies
        working-directory: mcpval-mcp
        run: npm ci

      - name: Test npm package
        working-directory: mcpval-mcp
        run: npm test

      - name: Build npm package
        working-directory: mcpval-mcp
        run: npm run build

      - name: Sensitive artifact check
        run: scripts/check-sensitive-artifacts.sh

      - name: Verify distribution contracts
        run: |
          scripts/verify-distribution-contracts.sh
          scripts/test-release-retry.sh

      - name: NuGet Audit
        run: |
          dotnet list mcp-benchmark-validation.sln package --vulnerable --include-transitive --format json > dotnet-audit.json
          python3 - <<'PY'
          import json
          import sys

          severities = {"low": 1, "moderate": 2, "high": 3, "critical": 4}
          threshold = severities["high"]
          findings = []

          def scan(node, project=None, framework=None):
              if isinstance(node, dict):
                  project = node.get("path", project)
                  framework = node.get("framework", framework)
                  package_name = node.get("name")
                  resolved_version = node.get("resolvedVersion") or node.get("requestedVersion")
                  vulnerabilities = node.get("vulnerabilities")

                  if package_name and isinstance(vulnerabilities, list):
                      for vulnerability in vulnerabilities:
                          severity = str(vulnerability.get("severity", "")).lower()
                          if severities.get(severity, 0) >= threshold:
                              findings.append({
                                  "severity": severity,
                                  "package": package_name,
                                  "version": resolved_version,
                                  "project": project,
                                  "framework": framework
                              })

                  for value in node.values():
                      scan(value, project, framework)
              elif isinstance(node, list):
                  for item in node:
                      scan(item, project, framework)

          with open("dotnet-audit.json", "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          scan(payload)

          if findings:
              print("High or critical NuGet vulnerabilities detected:")
              for finding in findings:
                  print(f"- {finding['severity']}: {finding['package']} {finding['version']} ({finding['project']} / {finding['framework']})")
              sys.exit(1)

          print("No high or critical NuGet vulnerabilities detected.")
          PY

      - name: npm Audit
        working-directory: mcpval-mcp
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          status=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const vulnerabilities = audit.metadata?.vulnerabilities ?? {};
          console.log(`npm audit summary: critical=${vulnerabilities.critical ?? 0}, high=${vulnerabilities.high ?? 0}, moderate=${vulnerabilities.moderate ?? 0}, low=${vulnerabilities.low ?? 0}`);
          NODE
          exit $status

      - name: Build (Debug)
        run: dotnet build --no-restore --configuration Debug

      - name: Test (Unit & Integration)
        run: dotnet test --no-build --configuration Debug --filter 'FullyQualifiedName!~ValidatorOverheadBudgetTests' --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Validate Benchmark Project
        run: |
          dotnet build Mcp.Benchmark.Benchmarks/Mcp.Benchmark.Benchmarks.csproj --no-restore --configuration Release
          benchmarks=$(dotnet run --project Mcp.Benchmark.Benchmarks/Mcp.Benchmark.Benchmarks.csproj --configuration Release --no-build -- --list flat)
          grep -q 'ConfigurationCapture' <<< "$benchmarks"
          grep -q 'HostStartup' <<< "$benchmarks"
          grep -q 'Planning' <<< "$benchmarks"
          grep -q 'VerdictReduction' <<< "$benchmarks"
          grep -q 'Scoring' <<< "$benchmarks"
          grep -q 'MarkdownRendering' <<< "$benchmarks"

      - name: Performance regression budgets (Release)
        run: dotnet test Mcp.Benchmark.Tests/Mcp.Benchmark.Tests.csproj --configuration Release --filter 'FullyQualifiedName~ValidatorOverheadBudgetTests' --verbosity minimal

      - name: Verdict mutation gate
        env:
          MUTATION_CONCURRENCY: '2'
        run: scripts/validate-mutation.sh

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Upload Audit Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-results
          path: |
            dotnet-audit.json
            mcpval-mcp/npm-audit.json

  security-analysis:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore .NET dependencies
        if: matrix.language == 'csharp'
        run: dotnet restore --locked-mode

      - name: Build .NET for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build --no-restore --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          category: /language:${{ matrix.language }}

  release-reservation:
    name: Reserve Immutable Release Tag
    needs: [build-and-test, security-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Reserve or verify tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.build-and-test.outputs.version }}"
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            existing_revision=$(git rev-list -n 1 "$tag")
            [[ "$existing_revision" == "$GITHUB_SHA" ]] || {
              echo "Immutable tag $tag already points to $existing_revision; refusing all registry publication." >&2
              exit 1
            }
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

  # Create the self-contained EXE for multiple platforms
  package:
    name: Package ${{ matrix.rid }} v${{ needs.build-and-test.outputs.version }}
    needs: [build-and-test]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows
            runner: windows-latest
          - rid: linux-x64
            os: linux
            runner: ubuntu-latest
          - rid: linux-arm64
            os: linux
            runner: ubuntu-24.04-arm
          - rid: osx-x64
            os: osx
            runner: macos-15-intel
          - rid: osx-arm64
            os: osx
            runner: macos-15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet restore ${{ env.PROJECT_PATH }} \
            --locked-mode
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:VersionPrefix=${{ needs.build-and-test.outputs.version }} \
            -p:Version=${{ needs.build-and-test.outputs.version }} \
            -o publish/${{ matrix.rid }}

      # Rename to include architecture for the release asset
      - name: Prepare Artifact
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          if [ "${{ matrix.os }}" == "windows" ]; then
            mv mcpval.exe mcpval-${{ matrix.rid }}.exe
            python "$GITHUB_WORKSPACE/scripts/package-standalone.py" --windows --input "mcpval-${{ matrix.rid }}.exe" --output "mcpval-${{ matrix.rid }}.zip"
          else
            mv mcpval mcpval-${{ matrix.rid }}
            python "$GITHUB_WORKSPACE/scripts/package-standalone.py" --input "mcpval-${{ matrix.rid }}" --output "mcpval-${{ matrix.rid }}.tar.gz"
          fi

      - name: Smoke Final Standalone Artifact
        shell: bash
        run: |
          executable="publish/${{ matrix.rid }}/mcpval-${{ matrix.rid }}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            executable="${executable}.exe"
          fi
          scripts/smoke-distribution.sh \
            --version "${{ needs.build-and-test.outputs.version }}" \
            --standalone "$executable"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcpval-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/mcpval-${{ matrix.rid }}*
          retention-days: 5

  standalone-artifact-smoke:
    name: "Smoke uploaded standalone (${{ matrix.rid }})"
    needs: [build-and-test, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            archive: mcpval-win-x64.zip
            executable: mcpval-win-x64.exe
            windows: true
          - rid: linux-x64
            runner: ubuntu-latest
            archive: mcpval-linux-x64.tar.gz
            executable: mcpval-linux-x64
            windows: false
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            archive: mcpval-linux-arm64.tar.gz
            executable: mcpval-linux-arm64
            windows: false
          - rid: osx-x64
            runner: macos-15-intel
            archive: mcpval-osx-x64.tar.gz
            executable: mcpval-osx-x64
            windows: false
          - rid: osx-arm64
            runner: macos-15
            archive: mcpval-osx-arm64.tar.gz
            executable: mcpval-osx-arm64
            windows: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpval-${{ matrix.rid }}
          path: smoke/standalone
      - name: Extract and execute uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          cd smoke/standalone
          mkdir extracted
          if [[ "${{ matrix.windows }}" == "true" ]]; then
            python -m zipfile -e "${{ matrix.archive }}" extracted
          else
            tar -xf "${{ matrix.archive }}" -C extracted
          fi
          executable="extracted/${{ matrix.executable }}"
          if [[ "${{ matrix.windows }}" == "false" ]]; then chmod +x "$executable"; fi
          "$GITHUB_WORKSPACE/scripts/smoke-distribution.sh" \
            --version "${{ needs.build-and-test.outputs.version }}" \
            --standalone "$executable"

  # Create GitHub Release (Only on main push)
  publish:
    name: Publish Release
    needs: [build-and-test, package, nuget-publish, npm-publish, docker-publish]
    # Only run on push to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mcpval-*
          path: release-assets
          merge-multiple: true

      - name: Generate Release Tag
        id: tag
        run: |
          set -euo pipefail
          version="${{ needs.build-and-test.outputs.version }}"
          tag="v${version}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            existing_revision=$(git rev-list -n 1 "$tag")
            if [[ "$existing_revision" != "$GITHUB_SHA" ]]; then
              echo "Release tag $tag already points to $existing_revision. Bump VersionPrefix explicitly." >&2
              exit 1
            fi
            echo "Release tag $tag already points to this source revision; continuing safe retry."
          fi
          IFS='.' read -r major minor _ <<< "$version"
          channel=stable
          prerelease=false
          if [[ "$version" == *-* ]]; then
            channel=preview
            prerelease=true
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "minor_tag=v${major}.${minor}"
            echo "major_tag=v${major}"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "### 🚀 Release v${{ steps.tag.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Checksums
        shell: bash
        run: |
          cd release-assets
          mapfile -d '' artifacts < <(find . -maxdepth 1 -type f \
            ! -name '*.sig' \
            ! -name '*.pem' \
            ! -name '*.sigstore.json' \
            ! -name 'SHA256SUMS.txt' \
            -printf '%f\0' | sort -z)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found to checksum." >&2
            exit 1
          fi
          shasum -a 256 "${artifacts[@]}" > SHA256SUMS.txt

      - name: Generate Release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/sbom-release-binaries.spdx.json

      - name: Canonicalize Release SBOM
        shell: bash
        run: |
          jq -S \
            --arg namespace "https://github.com/${GITHUB_REPOSITORY}/sbom/${GITHUB_SHA}" \
            '.documentNamespace = $namespace | .creationInfo.created = "1970-01-01T00:00:00Z" | .creationInfo.creators |= sort' \
            release-assets/sbom-release-binaries.spdx.json > release-assets/sbom.tmp.json
          mv release-assets/sbom.tmp.json release-assets/sbom-release-binaries.spdx.json

      - name: Generate Cross-Channel Distribution Manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.tag.outputs.channel }}
          NUGET_SHA256: ${{ needs.nuget-publish.outputs.package-sha256 }}
          NPM_SHA256: ${{ needs.npm-publish.outputs.package-sha256 }}
          CONTAINER_DIGEST: ${{ needs.docker-publish.outputs.image-digest }}
        run: |
          release_checksums_sha256=$(sha256sum release-assets/SHA256SUMS.txt | awk '{print $1}')
          release_sbom_sha256=$(sha256sum release-assets/sbom-release-binaries.spdx.json | awk '{print $1}')
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg channel "$RELEASE_CHANNEL" \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg nugetSha256 "$NUGET_SHA256" \
            --arg npmSha256 "$NPM_SHA256" \
            --arg containerDigest "$CONTAINER_DIGEST" \
            --arg releaseChecksumsSha256 "$release_checksums_sha256" \
            --arg releaseSbomSha256 "$release_sbom_sha256" \
            '{
              documentType: "mcpval.distribution-manifest",
              documentVersion: "1.0.0",
              version: $version,
              channel: $channel,
              sourceRevision: $sourceRevision,
              channels: {
                nuget: { package: "McpVal", sha256: $nugetSha256 },
                npm: { package: "mcpval-localmcp", sha256: $npmSha256 },
                container: { image: "ghcr.io/${{ github.repository }}", digest: $containerDigest },
                releaseAssets: { checksumsFile: "SHA256SUMS.txt", checksumsSha256: $releaseChecksumsSha256 },
                releaseSbom: { file: "sbom-release-binaries.spdx.json", sha256: $releaseSbomSha256 }
              }
            }' > release-assets/DISTRIBUTION-MANIFEST.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Verify Existing Release for Safe Retry
        id: existing-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            shopt -s nullglob
            mapfile -d '' subjects < <(find release-assets -maxdepth 1 -type f \
              ! -name '*.sig' \
              ! -name '*.pem' \
              ! -name '*.sigstore.json' \
              -print0 | sort -z)
            declare -A expected_assets=()
            for subject in "${subjects[@]}"; do
              name=$(basename "$subject")
              expected_assets["$name"]=1
              [[ -f "$existing/$name" ]] || { echo "Existing release is missing $name." >&2; exit 1; }
              scripts/verify-retry-payload.sh file "$subject" "$existing/$name" "GitHub release asset $name"
              for suffix in sig pem sigstore.json; do
                [[ -f "$existing/$name.$suffix" ]] || { echo "Existing release is missing $name.$suffix." >&2; exit 1; }
              done
              cosign verify-blob "$existing/$name" \
                --bundle "$existing/$name.sigstore.json" \
                --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/(ci|release-signing-backfill).yml@refs/(heads/main|tags/v.*)$" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
              cosign verify-blob "$existing/$name" \
                --signature "$existing/$name.sig" \
                --certificate "$existing/$name.pem" \
                --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/(ci|release-signing-backfill).yml@refs/(heads/main|tags/v.*)$" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
              for suffix in sig pem sigstore.json; do expected_assets["$name.$suffix"]=1; done
            done
            while IFS= read -r asset; do
              name=$(basename "$asset")
              [[ -n "${expected_assets[$name]:-}" ]] || { echo "Existing release contains unexpected asset $name." >&2; exit 1; }
            done < <(find "$existing" -maxdepth 1 -type f -print)
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing release subjects are byte-identical; replacement will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest Release Binaries
        if: steps.existing-release.outputs.exists != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-assets/*

      - name: Sign Release Assets
        if: steps.existing-release.outputs.exists != 'true'
        shell: bash
        run: |
          cd release-assets
          mapfile -d '' artifacts < <(find . -maxdepth 1 -type f \
            ! -name '*.sig' \
            ! -name '*.pem' \
            ! -name '*.sigstore.json' \
            -print0 | sort -z)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found to sign." >&2
            exit 1
          fi

          for artifact in "${artifacts[@]}"; do
            cosign sign-blob --yes "$artifact" \
              --bundle "$artifact.sigstore.json" \
              --output-signature "$artifact.sig" \
              --output-certificate "$artifact.pem"
          done

      - name: Publish Immutable Release Tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify --quiet "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null; then
            git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}" "$GITHUB_SHA"
            git push origin "refs/tags/${{ steps.tag.outputs.tag }}"
          fi

      - name: Create Release
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          body: |
            ## Distribution

            This release is published across multiple public channels. GitHub Marketplace is only the listing for the root composite action used with `uses: navalerakesh/mcp-validation-security@...`.

            ## Install

            **NuGet** (cross-platform, requires .NET 8):
            ```bash
            dotnet tool install --global McpVal --version ${{ steps.tag.outputs.version }}
            ```
            [![NuGet](https://img.shields.io/nuget/v/McpVal?logo=nuget)](https://www.nuget.org/packages/McpVal)

            **npm** (MCP server for AI agents):
            ```bash
            npx mcpval-localmcp@${{ steps.tag.outputs.version }}
            ```
            [![npm](https://img.shields.io/npm/v/mcpval-localmcp?logo=npm)](https://www.npmjs.com/package/mcpval-localmcp)

            **Docker** (hardened non-root GHCR image):
            ```bash
            docker run --rm ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.version }} --version
            ```

            **Standalone binaries** (no runtime needed):
            Download the binary for your platform below.

      - name: Update Action Version Tags
        if: steps.tag.outputs.channel == 'stable'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for alias_tag in "${{ steps.tag.outputs.minor_tag }}" "${{ steps.tag.outputs.major_tag }}"; do
            current_version=""
            if git rev-parse --verify --quiet "refs/tags/$alias_tag" >/dev/null; then
              current_version=$(git show "$alias_tag:Directory.Build.props" | sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p')
            fi
            node scripts/verify-version-promotion.mjs "$current_version" "${{ steps.tag.outputs.version }}"
            git tag -fa "$alias_tag" -m "Release ${{ steps.tag.outputs.tag }}" "${GITHUB_SHA}"
            git push origin "refs/tags/$alias_tag" --force
          done

  # Build, smoke, attest, and stage the NuGet global tool before any registry write.
  nuget-package:
    name: "Prepare NuGet (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      package-sha256: ${{ steps.nuget-checksum.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Summary
        run: echo "### 📦 Preparing McpVal v${{ needs.build-and-test.outputs.version }} for NuGet" >> "$GITHUB_STEP_SUMMARY"

      - name: Build & Pack NuGet Package
        run: |
          dotnet restore Mcp.Benchmark.CLI/Mcp.Benchmark.CLI.csproj --locked-mode
          dotnet build Mcp.Benchmark.CLI/Mcp.Benchmark.CLI.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ needs.build-and-test.outputs.version }}
          dotnet pack Mcp.Benchmark.CLI/Mcp.Benchmark.CLI.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ needs.build-and-test.outputs.version }} \
            -o ./artifacts/nuget

      - name: Smoke Packed NuGet Tool
        shell: bash
        run: |
          package=$(find artifacts/nuget -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' -print -quit)
          [[ -n "$package" ]] || { echo "No NuGet package found for smoke test." >&2; exit 1; }
          scripts/smoke-distribution.sh \
            --version "${{ needs.build-and-test.outputs.version }}" \
            --nuget "$package"

      - name: Smoke Composite Action Against Packed Tool
        uses: ./
        with:
          server: https://1.1.1.1/mcp
          access: public
          version: ${{ needs.build-and-test.outputs.version }}
          package-source: ${{ github.workspace }}/artifacts/nuget
          upload-artifacts: 'false'
          github-summary: 'false'
          github-annotations: 'false'
          dry-run: "true"
          output-format: json

      - name: Generate NuGet Checksums
        id: nuget-checksum
        shell: bash
        run: |
          cd artifacts/nuget
          shopt -s nullglob
          packages=(*.nupkg *.snupkg)
          [[ "${#packages[@]}" -gt 0 ]] || { echo "No NuGet artifacts to checksum." >&2; exit 1; }
          sha256sum "${packages[@]}" > mcpval.nuget.SHA256SUMS.txt
          package=$(printf '%s\n' "${packages[@]}" | grep -v '\.snupkg$' | head -1)
          echo "package-sha256=$(sha256sum "$package" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Generate NuGet SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/nuget
          format: spdx-json
          output-file: artifacts/nuget/mcpval.nuget.spdx.json

      - name: Attest NuGet Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            artifacts/nuget/*.nupkg

      - name: Upload NuGet Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpval-nuget-package-artifacts
          path: |
            artifacts/nuget/*.nupkg
            artifacts/nuget/*.snupkg
            artifacts/nuget/mcpval.nuget.SHA256SUMS.txt
            artifacts/nuget/mcpval.nuget.spdx.json

  # Build, smoke, attest, and stage the npm package before any registry write.
  npm-package:
    name: "Prepare npm (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      package-sha256: ${{ steps.npm-checksum.outputs.package-sha256 }}
    defaults:
      run:
        working-directory: mcpval-mcp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Set Version
        run: npm version "${{ needs.build-and-test.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Summary
        run: echo "### 📦 Preparing mcpval-localmcp v${{ needs.build-and-test.outputs.version }} for npm" >> "$GITHUB_STEP_SUMMARY"

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Pack npm Artifact
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination ./dist-pack

      - name: Smoke Packed npm MCP Server
        run: |
          package=$(find dist-pack -maxdepth 1 -name '*.tgz' -print -quit)
          [[ -n "$package" ]] || { echo "No npm package found for smoke test." >&2; exit 1; }
          node ../scripts/smoke-npm-package.mjs "$package" "${{ needs.build-and-test.outputs.version }}"

      - name: Generate npm Checksums
        id: npm-checksum
        run: |
          cd dist-pack
          shopt -s nullglob
          packages=(*.tgz)
          [[ "${#packages[@]}" -gt 0 ]] || { echo "No npm artifacts to checksum." >&2; exit 1; }
          sha256sum "${packages[@]}" > mcpval.npm.SHA256SUMS.txt
          echo "package-sha256=$(sha256sum "${packages[0]}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Generate npm SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ./mcpval-mcp/dist-pack
          format: spdx-json
          output-file: ./mcpval-mcp/dist-pack/mcpval-localmcp.npm.spdx.json

      - name: Attest npm Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            mcpval-mcp/dist-pack/*.tgz

      - name: Upload npm Package Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpval-npm-package-artifacts
          path: |
            mcpval-mcp/dist-pack/*.tgz
            mcpval-mcp/dist-pack/mcpval.npm.SHA256SUMS.txt
            mcpval-mcp/dist-pack/mcpval-localmcp.npm.spdx.json

  docker-package:
    name: "Prepare Docker Image ${{ matrix.platform }} (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
          - platform: linux/arm64
            architecture: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Prepare Container Artifact Directory
        run: mkdir -p artifacts/container

      - name: Build Exact Docker Image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.build-and-test.outputs.version }}
          tags: mcpval-release-smoke:${{ needs.build-and-test.outputs.version }}-${{ matrix.architecture }}

      - name: Smoke Exact Docker Image
        shell: bash
        run: |
          output=$(docker run --rm --platform "${{ matrix.platform }}" mcpval-release-smoke:${{ needs.build-and-test.outputs.version }}-${{ matrix.architecture }} --version)
          [[ "$output" == "mcpval ${{ needs.build-and-test.outputs.version }}" ]] || {
            echo "Docker version mismatch: $output" >&2
            exit 1
          }

      - name: Generate Container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mcpval-release-smoke:${{ needs.build-and-test.outputs.version }}-${{ matrix.architecture }}
          format: spdx-json
          output-file: artifacts/container/mcpval.container-${{ matrix.architecture }}.spdx.json

      - name: Save Exact Docker Image
        id: docker-checksum
        shell: bash
        run: |
          mkdir -p artifacts/container
          archive="mcpval-image-${{ matrix.architecture }}.tar.gz"
          docker save mcpval-release-smoke:${{ needs.build-and-test.outputs.version }}-${{ matrix.architecture }} | gzip -n > "artifacts/container/$archive"
          (cd artifacts/container && sha256sum "$archive" > "SHA256SUMS-${{ matrix.architecture }}.txt")

      - name: Upload Exact Docker Image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-artifacts-${{ matrix.architecture }}
          path: artifacts/container/*

  package-install-smoke:
    name: "Clean install smoke (${{ matrix.os }})"
    needs: [build-and-test, nuget-package, npm-package]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpval-nuget-package-artifacts
          path: smoke/nuget

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpval-npm-package-artifacts
          path: smoke/npm

      - name: Execute Composite Action with Packed Tool
        uses: ./
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/mcpval-action-nuget-cache
          DOTNET_CLI_HOME: ${{ runner.temp }}/mcpval-action-dotnet-home
        with:
          server: https://1.1.1.1/mcp
          access: public
          version: ${{ needs.build-and-test.outputs.version }}
          package-source: ${{ github.workspace }}/smoke/nuget
          upload-artifacts: 'false'
          github-summary: 'false'
          github-annotations: 'false'
          dry-run: "true"
          output-format: json

      - name: Install and Execute Packed Artifacts
        shell: bash
        run: |
          nuget_package=$(find smoke/nuget -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' -print -quit)
          npm_package=$(find smoke/npm -maxdepth 1 -name '*.tgz' -print -quit)
          [[ -n "$nuget_package" && -n "$npm_package" ]] || { echo "Required package artifact missing." >&2; exit 1; }
          scripts/smoke-distribution.sh --version "${{ needs.build-and-test.outputs.version }}" --nuget "$nuget_package"
          node scripts/smoke-npm-package.mjs "$npm_package" "${{ needs.build-and-test.outputs.version }}"

  nuget-publish:
    name: "Publish NuGet (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test, release-reservation, package, standalone-artifact-smoke, docker-package, package-install-smoke, nuget-package, npm-package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: NuGet
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      package-sha256: ${{ steps.publish-nuget.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpval-nuget-package-artifacts
          path: artifacts/nuget

      - name: Publish or Verify Existing NuGet Package
        id: publish-nuget
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          version="${{ needs.build-and-test.outputs.version }}"
          package=$(find artifacts/nuget -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' -print -quit)
          [[ -n "$package" ]] || { echo "No NuGet package found." >&2; exit 1; }
          remote="$RUNNER_TEMP/McpVal.$version.nupkg"
          url="https://api.nuget.org/v3-flatcontainer/mcpval/${version,,}/mcpval.${version,,}.nupkg"
          if curl --fail --silent --show-error "$url" --output "$remote"; then
            mkdir -p "$RUNNER_TEMP/nuget-local" "$RUNNER_TEMP/nuget-remote"
            unzip -q "$package" -d "$RUNNER_TEMP/nuget-local"
            unzip -q "$remote" -d "$RUNNER_TEMP/nuget-remote"
            rm -f "$RUNNER_TEMP/nuget-local/.signature.p7s" "$RUNNER_TEMP/nuget-remote/.signature.p7s"
            scripts/verify-retry-payload.sh tree "$RUNNER_TEMP/nuget-local" "$RUNNER_TEMP/nuget-remote" "NuGet $version"
            echo "NuGet package already published with identical payloads; retry is safe."
          else
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$url" --output "$remote" && dotnet nuget verify "$remote" --all; then
              break
            fi
            [[ "$attempt" -lt 12 ]] || { echo "Published NuGet package was not downloadable with a valid repository signature." >&2; exit 1; }
            sleep 5
          done
          rm -rf "$RUNNER_TEMP/nuget-local" "$RUNNER_TEMP/nuget-remote"
          mkdir -p "$RUNNER_TEMP/nuget-local" "$RUNNER_TEMP/nuget-remote"
          unzip -q "$package" -d "$RUNNER_TEMP/nuget-local"
          unzip -q "$remote" -d "$RUNNER_TEMP/nuget-remote"
          rm -f "$RUNNER_TEMP/nuget-local/.signature.p7s" "$RUNNER_TEMP/nuget-remote/.signature.p7s"
          scripts/verify-retry-payload.sh tree "$RUNNER_TEMP/nuget-local" "$RUNNER_TEMP/nuget-remote" "final NuGet $version"
          remote_sha=$(sha256sum "$remote" | awk '{print $1}')
          echo "package-sha256=$remote_sha" >> "$GITHUB_OUTPUT"

      - name: Attest Repository-Signed NuGet Package
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/McpVal.${{ needs.build-and-test.outputs.version }}.nupkg

  npm-publish:
    name: "Publish npm (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test, release-reservation, npm-package, nuget-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Npm
    permissions:
      contents: read
      id-token: write
    outputs:
      package-sha256: ${{ steps.publish-npm.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mcpval-npm-package-artifacts
          path: artifacts/npm

      - name: Publish or Verify Existing npm Package
        id: publish-npm
        shell: bash
        working-directory: artifacts/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.build-and-test.outputs.version }}"
          package=$(find . -maxdepth 1 -name '*.tgz' -print -quit)
          [[ -n "$package" ]] || { echo "No npm package found." >&2; exit 1; }
          local_sha=$(shasum "$package" | awk '{print $1}')
          remote_sha=$(npm view "mcpval-localmcp@$version" dist.shasum 2>/dev/null || true)
          if [[ -n "$remote_sha" ]]; then
            "$GITHUB_WORKSPACE/scripts/verify-retry-payload.sh" digest "$local_sha" "$remote_sha" "npm $version"
            echo "npm package already published with identical bytes; retry is safe."
          else
            candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            npm publish "$package" --access public --provenance --tag "$candidate_tag"
          fi
          remote_url=$(npm view "mcpval-localmcp@$version" dist.tarball)
          remote_package="$RUNNER_TEMP/mcpval-localmcp-$version.tgz"
          curl --fail --silent --show-error "$remote_url" --output "$remote_package"
          local_sha256=$(sha256sum "$package" | awk '{print $1}')
          remote_sha256=$(sha256sum "$remote_package" | awk '{print $1}')
          "$GITHUB_WORKSPACE/scripts/verify-retry-payload.sh" digest "$local_sha256" "$remote_sha256" "final npm $version"
          provenance_url=$(npm view "mcpval-localmcp@$version" dist.attestations.url 2>/dev/null || true)
          [[ "$provenance_url" == https://registry.npmjs.org/-/npm/v1/attestations/* ]] || {
            echo "npm registry provenance attestation is missing for $version." >&2
            exit 1
          }
          audit_dir="$RUNNER_TEMP/npm-provenance-$version"
          mkdir -p "$audit_dir"
          (cd "$audit_dir" && npm init --yes >/dev/null && npm install --package-lock-only "mcpval-localmcp@$version" >/dev/null && npm audit signatures)
          publish_tag=latest
          [[ "$version" == *-* ]] && publish_tag=preview
          current_channel_version=$(npm view "mcpval-localmcp" "dist-tags.$publish_tag" 2>/dev/null || true)
          node "$GITHUB_WORKSPACE/scripts/verify-version-promotion.mjs" "$current_channel_version" "$version"
          npm dist-tag add "mcpval-localmcp@$version" "$publish_tag"
          candidate_tag="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm dist-tag rm "mcpval-localmcp" "$candidate_tag" >/dev/null 2>&1 || true
          echo "package-sha256=$remote_sha256" >> "$GITHUB_OUTPUT"

  docker-publish:
    name: "Publish Container (v${{ needs.build-and-test.outputs.version }})"
    needs: [build-and-test, release-reservation, docker-package, npm-publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Ghcr
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.push-container.outputs.image-digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: docker-image-artifacts-*
          path: artifacts/container
          merge-multiple: true

      - name: Verify and Load Exact Image
        shell: bash
        run: |
          cd artifacts/container
          for architecture in amd64 arm64; do
            sha256sum --check "SHA256SUMS-$architecture.txt"
            gunzip --stdout "mcpval-image-$architecture.tar.gz" | docker load
            docker image inspect "mcpval-release-smoke:${{ needs.build-and-test.outputs.version }}-$architecture" >/dev/null
          done

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Exact Image Bytes
        id: push-container
        shell: bash
        run: |
          version="${{ needs.build-and-test.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          candidate="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          digests=()
          for architecture in amd64 arm64; do
            source="mcpval-release-smoke:$version-$architecture"
            architecture_candidate="$candidate-$architecture"
            docker tag "$source" "$image:$architecture_candidate"
            docker push "$image:$architecture_candidate" | tee "$RUNNER_TEMP/docker-$architecture.log"
            architecture_digest=$(awk '/digest: sha256:/{print $3}' "$RUNNER_TEMP/docker-$architecture.log" | tail -1)
            [[ "$architecture_digest" == sha256:* ]] || { echo "Unable to resolve $architecture image digest." >&2; exit 1; }
            digests+=("$image@$architecture_digest")
          done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$version" \
            --tag "$image:$candidate" \
            "${digests[@]}"
          digest=$(docker buildx imagetools inspect "$image:$candidate" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" == sha256:* ]] || { echo "Unable to resolve candidate image digest." >&2; exit 1; }
          docker buildx imagetools inspect "$image:$candidate" --raw > "$RUNNER_TEMP/container-manifest.json"
          jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' \
            "$RUNNER_TEMP/container-manifest.json" >/dev/null || {
              echo "Candidate container manifest must contain exactly linux/amd64 and linux/arm64." >&2
              exit 1
            }

          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Sign and Attach SBOM
        shell: bash
        run: |
          subject="ghcr.io/${{ github.repository }}@${{ steps.push-container.outputs.image-digest }}"
          cosign sign --yes "$subject"
          predicates=(
            artifacts/container/mcpval.container-amd64.spdx.json
            artifacts/container/mcpval.container-arm64.spdx.json
          )
          for predicate in "${predicates[@]}"; do
            [[ -f "$predicate" ]] || { echo "Missing required container SBOM: $predicate" >&2; exit 1; }
            cosign attest --yes --type spdxjson --predicate "$predicate" "$subject"
          done

      - name: Attest Container Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push-container.outputs.image-digest }}
          push-to-registry: true

      - name: Promote Signed Container Tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.build-and-test.outputs.version }}"
          image="ghcr.io/${{ github.repository }}"
          digest="${{ steps.push-container.outputs.image-digest }}"
          for tag in "$version" "v$version"; do
            existing=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
            if [[ -n "$existing" ]]; then
              scripts/verify-retry-payload.sh digest "$digest" "$existing" "container tag $tag"
            else
              docker buildx imagetools create \
                --annotation "index:org.opencontainers.image.version=$version" \
                --tag "$image:$tag" \
                "$image@$digest"
            fi
          done
          channel_tag=latest
          [[ "$version" == *-* ]] && channel_tag=preview
          current_channel_version=""
          if docker buildx imagetools inspect "$image:$channel_tag" --raw > "$RUNNER_TEMP/current-channel-manifest.json" 2>/dev/null; then
            current_channel_version=$(jq -r '.annotations["org.opencontainers.image.version"] // empty' "$RUNNER_TEMP/current-channel-manifest.json")
            [[ -n "$current_channel_version" ]] || {
              echo "Existing $image:$channel_tag lacks required OCI version metadata; refusing mutable alias replacement." >&2
              exit 1
            }
          fi
          node scripts/verify-version-promotion.mjs "$current_channel_version" "$version"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=$version" \
            --tag "$image:$channel_tag" \
            "$image@$digest"
