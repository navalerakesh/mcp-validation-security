name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: 'csharp'
            build-mode: manual
          - language: 'javascript-typescript'
            build-mode: none

    steps:
      - name: Check code scanning availability
        id: code-scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o code-scanning-status.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/code-scanning/alerts?per_page=1")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          message=$(jq -r '.message // empty' code-scanning-status.json 2>/dev/null || true)
          echo "enabled=false" >> "$GITHUB_OUTPUT"

          if [ -n "$message" ]; then
            echo "::error::CodeQL requires code scanning for ${GITHUB_REPOSITORY}: ${message}"
          else
            echo "::error::CodeQL requires code scanning for ${GITHUB_REPOSITORY} (HTTP ${status})."
          fi

      - name: CodeQL unavailable
        if: steps.code-scanning.outputs.enabled != 'true'
        run: |
          echo "GitHub code scanning is not enabled; the required CodeQL gate cannot run." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.code-scanning.outputs.enabled == 'true'

      - name: Setup .NET
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'javascript-typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: mcpval-mcp/package-lock.json

      - name: Initialize CodeQL
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore .NET dependencies
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'csharp'
        run: dotnet restore --locked-mode

      - name: Build .NET
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'csharp'
        run: dotnet build --no-restore --configuration Release

      - name: Install npm dependencies
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'javascript-typescript'
        working-directory: mcpval-mcp
        run: npm ci

      - name: Build npm package
        if: steps.code-scanning.outputs.enabled == 'true' && matrix.language == 'javascript-typescript'
        working-directory: mcpval-mcp
        run: npm run build

      - name: Perform CodeQL Analysis
        if: steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}