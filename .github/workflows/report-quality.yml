name: Report Quality

on:
  pull_request:
    paths:
      - 'Mcp.Benchmark.Core/**'
      - 'Mcp.Benchmark.ClientProfiles/**'
      - 'Mcp.Compliance.Spec/**'
      - 'Mcp.Benchmark.Infrastructure/*.csproj'
      - 'Mcp.Benchmark.Infrastructure/Services/Reporting/**'
      - 'Mcp.Benchmark.CLI/**'
      - 'Mcp.Benchmark.Tests/Unit/Reporting/**'
      - 'Mcp.Benchmark.Tests/Unit/Commands/ReportCommandTests.cs'
      - 'Mcp.Benchmark.Tests/Unit/Contracts/PublicArtifactSchemaTests.cs'
      - 'Mcp.Benchmark.Tests/*.csproj'
      - 'Mcp.Benchmark.Tests/Fixtures/Report*'
      - 'Mcp.Benchmark.Tests/Fixtures/ReportSnapshots/**'
      - 'scripts/generate-report-corpus.sh'
      - 'scripts/report-quality/**'
      - 'docs/Reporting.md'
      - 'docs/Schemas/**'
      - 'docs/Design/ReportQualityStandard.md'
      - '.github/workflows/report-quality.yml'
      - 'Directory.Build.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: scripts/report-quality/package-lock.json
      - run: dotnet restore --locked-mode
      - name: Renderer, CLI and schema checks
        run: dotnet test Mcp.Benchmark.Tests/Mcp.Benchmark.Tests.csproj --no-restore --filter 'FullyQualifiedName~Unit.Reporting|FullyQualifiedName~ReportCommandTests|FullyQualifiedName~PublicArtifactSchemaTests'
      - name: Generate synthetic CLI reports
        run: bash scripts/generate-report-corpus.sh ./artifacts/report-quality
      - run: npm ci --prefix scripts/report-quality --ignore-scripts
      - name: Install pinned browser
        working-directory: scripts/report-quality
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: npx playwright install --with-deps chromium
      - name: Browser and PDF checks
        run: node scripts/report-quality/check.mjs ./artifacts/report-quality
      - name: Upload synthetic review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-quality
          path: artifacts/report-quality
          if-no-files-found: error
          retention-days: 7
