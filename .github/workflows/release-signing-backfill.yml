name: Backfill Release Signatures

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable release tag to backfill (for example, v1.1.25).
        required: true
      distribution-manifest-sha256:
        description: Expected SHA-256 of DISTRIBUTION-MANIFEST.json from an independently reviewed source.
        required: true

permissions:
  contents: read

jobs:
  sign-releases:
    name: Sign Recent Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      - name: Verify and sign exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.distribution-manifest-sha256 }}
        run: |
          set -euo pipefail

          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag must be an exact immutable semantic-version tag." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "distribution-manifest-sha256 must be a SHA-256 digest." >&2
            exit 1
          fi

          work_dir="$RUNNER_TEMP/release-signing/$RELEASE_TAG"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          gh release download "$RELEASE_TAG" --dir "$work_dir" --clobber
          manifest="$work_dir/DISTRIBUTION-MANIFEST.json"
          [[ -f "$manifest" ]] || { echo "Release is missing DISTRIBUTION-MANIFEST.json." >&2; exit 1; }
          actual_manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
          [[ "${actual_manifest_sha,,}" == "${EXPECTED_MANIFEST_SHA256,,}" ]] || {
            echo "Distribution manifest digest mismatch." >&2
            exit 1
          }
          source_revision=$(jq -er '.sourceRevision' "$manifest")
          manifest_version=$(jq -er '.version' "$manifest")
          [[ "v$manifest_version" == "$RELEASE_TAG" ]] || { echo "Distribution manifest version does not match $RELEASE_TAG." >&2; exit 1; }
          tag_revision=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          [[ "$source_revision" == "$tag_revision" ]] || {
            echo "Distribution manifest source revision is not bound to $RELEASE_TAG." >&2
            exit 1
          }
          expected_checksums_sha=$(jq -er '.channels.releaseAssets.checksumsSha256' "$manifest")
          actual_checksums_sha=$(sha256sum "$work_dir/SHA256SUMS.txt" | awk '{print $1}')
          [[ "$actual_checksums_sha" == "$expected_checksums_sha" ]] || { echo "Standalone checksum manifest digest mismatch." >&2; exit 1; }
          (cd "$work_dir" && sha256sum --check SHA256SUMS.txt)
          sbom_name=$(jq -er '.channels.releaseSbom.file' "$manifest")
          expected_sbom_sha=$(jq -er '.channels.releaseSbom.sha256' "$manifest")
          sbom="$work_dir/$sbom_name"
          [[ -f "$sbom" ]] || { echo "Release is missing manifest-bound SBOM $sbom_name." >&2; exit 1; }
          actual_sbom_sha=$(sha256sum "$sbom" | awk '{print $1}')
          [[ "$actual_sbom_sha" == "$expected_sbom_sha" ]] || { echo "Release SBOM digest mismatch." >&2; exit 1; }

          mapfile -t checksum_subjects < <(awk '{print $2}' "$work_dir/SHA256SUMS.txt")
          artifacts=("$work_dir/SHA256SUMS.txt" "$manifest" "$sbom")
          for subject in "${checksum_subjects[@]}"; do
            [[ "$subject" != */* && -f "$work_dir/$subject" ]] || { echo "Invalid checksum subject: $subject" >&2; exit 1; }
            artifacts+=("$work_dir/$subject")
          done

          unsigned_artifacts=()
          for artifact in "${artifacts[@]}"; do
            if [[ -f "$artifact.sig" && -f "$artifact.pem" && -f "$artifact.sigstore.json" ]]; then
              cosign verify-blob "$artifact" \
                --bundle "$artifact.sigstore.json" \
                --certificate-identity-regexp "^https://github.com/${GH_REPO}/.github/workflows/(ci|release-signing-backfill).yml@refs/(heads/main|tags/v.*)$" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
              cosign verify-blob "$artifact" \
                --signature "$artifact.sig" \
                --certificate "$artifact.pem" \
                --certificate-identity-regexp "^https://github.com/${GH_REPO}/.github/workflows/(ci|release-signing-backfill).yml@refs/(heads/main|tags/v.*)$" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            else
              unsigned_artifacts+=("$artifact")
            fi
          done

          if [[ "${#unsigned_artifacts[@]}" -eq 0 ]]; then
            echo "No unsigned assets found for $RELEASE_TAG."
            exit 0
          fi

          upload_files=()
          for artifact in "${unsigned_artifacts[@]}"; do
            cosign sign-blob --yes "$artifact" \
                --bundle "$artifact.sigstore.json" \
                --output-signature "$artifact.sig" \
                --output-certificate "$artifact.pem"

            upload_files+=("$artifact.sig" "$artifact.pem" "$artifact.sigstore.json")
          done

          gh release upload "$RELEASE_TAG" "${upload_files[@]}" --clobber
